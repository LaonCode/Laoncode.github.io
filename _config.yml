title: LaonCode
description: 어느 한 대학생의 코딩 일지
url: "https://spactcode.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul
permalink: /:categories/:title/
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
paginate: 10
paginate_path: "/page:num/"
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Laon
exclude:
  - image-map.json
  - Gemfile
  - Gemfile.lock
  - vendor

featured_categories:
  - "개발"
  - "CTF/Wargame"
  - "Bug Bounty"
  - "블로그/기술문서"
  - "논문/컨퍼런스"
  - "공모전/자격증"
